name: Release

# Cuts a release from the version in .codex-plugin/plugin.json, so the tag and
# the Codex manifest can never disagree (v0.1.11 and v0.1.13 were tagged by
# hand with a stale version, and Codex keys its plugin cache on that field).
# Two steps: bump `version` on main, then run this workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Publish v<version> from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version .codex-plugin/plugin.json)
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error file=.codex-plugin/plugin.json::$TAG already exists. Bump version on main first."
            exit 1
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
          echo "Published $TAG"
