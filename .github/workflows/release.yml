name: Release

# Drafts a release from the version in .codex-plugin/plugin.json, so the tag and
# the Codex manifest can never disagree (v0.1.11 and v0.1.13 were tagged by
# hand with a stale version, and Codex keys its plugin cache on that field).
# Three steps: bump `version` on main, run this workflow, then open the draft
# and click "Publish release".
#
# The release is a draft because a release this workflow publishes with
# `github.token` starts no other workflow: GitHub doesn't deliver events
# made with that token. The production sync (sync-to-workspace.yml) and the
# version check (check-plugin-version.yml) run on `release: published`, so
# a person publishes the draft.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Draft v<version> from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version .codex-plugin/plugin.json)
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error file=.codex-plugin/plugin.json::$TAG already exists. Bump version on main first."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists, maybe as a draft. Publish or delete it first."
            exit 1
          fi
          URL=$(gh release create "$TAG" --draft --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes)
          echo "::notice title=Publish $TAG to finish the release::Open $URL and click Publish release. Publishing starts the production sync."
          echo "### Publish $TAG to finish the release" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the draft and click **Publish release**: $URL" >> "$GITHUB_STEP_SUMMARY"
